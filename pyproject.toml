[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenMuse"
version = "0.1.9"
description = "Record and Stream Muse S Athena signals with Python"
readme = "README.md"
# The core (record / decode / find) needs only bleak + numpy + pandas and runs
# on 3.10+. The >=3.12 floor came from mne-lsl, which is now an optional extra.
requires-python = ">=3.10"
dependencies = [
  "bleak>=0.21.0",
  "numpy>=1.24.0",
  "pandas>=1.5.0",
]
authors = [{ name = "" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# `OpenMuse stream` -- LSL output
stream = ["mne-lsl>=1.10.0"]
# `OpenMuse view` -- realtime plotting
view = ["vispy>=0.12.0"]
# everything
all = ["mne-lsl>=1.10.0", "vispy>=0.12.0"]

[project.scripts]
OpenMuse = "OpenMuse.cli:main"

[tool.setuptools]
packages = ["OpenMuse"]
